{% extends 'eventos/base.html' %}
{% block title %}Eliminar Evento{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Confirmar eliminación</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead">¿Estás seguro de que deseas eliminar el evento <strong>{{ evento.nombre }}</strong>?</p>
                <p class="text-muted">Esta acción no se puede deshacer.</p>
                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">Sí, eliminar</button>
                </form>
                <a href="{% url 'evento_detalle' evento.pk %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
